# Render Blueprint for the FREE plan: one web service that serves the website, the API and the WebSocket channel.
# No worker and no paid Redis: tasks run inside the web process (single instance) and scheduled jobs are triggered by an
# external timer that calls /api/v1/system/cron/<job>/ (see docs/RENDER.md). Nothing here needs a card on file.
# Secrets are NOT stored here: every `sync: false` variable is entered once in the Render dashboard.

services:
  - type: web
    name: ntsrestaurant
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: cd backend && python manage.py migrate --noinput && daphne --proxy-headers -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SINGLE_INSTANCE
        value: "true"            # in-memory cache, WebSockets and inline tasks: correct for exactly one instance
      - key: PUBLIC_URL_SCHEME
        value: https
      - key: MFA_ENFORCEMENT
        value: "true"
      - key: UPLOAD_SCANNER
        value: builtin
      - key: UPLOAD_SCAN_FAIL_CLOSED
        value: "true"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: PAYMENT_PROVIDER
        value: monime
      - key: BREVO_SENDER_NAME
        value: NTS Restaurant Platform
      - key: PLATFORM_DOMAIN
        value: ntsrestaurant.onrender.com
      - key: PLATFORM_HOSTS
        value: ntsrestaurant.onrender.com
      - key: ALLOWED_HOSTS
        value: ntsrestaurant.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ntsrestaurant.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ntsrestaurant.onrender.com
      - key: DB_CONN_MAX_AGE
        value: "60"
      # --- entered in the dashboard (same values as your local backend/.env) ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: MONIME_API_KEY
        sync: false
      - key: MONIME_SPACE_ID
        sync: false
      - key: MONIME_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
